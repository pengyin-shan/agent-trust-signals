# Runtime settings for the Stage 1-2 runner. NOT part of the frozen protocol:
# endpoints, key locations, and transport tuning live here; model identity
# lives ONLY in protocol/protocol_config.yaml (frozen). Do not add model
# strings to this file.
#
# Note (2026-08-24): the frozen config's frontier_openweight note states the
# DeepInfra endpoint was "recorded at freeze", but no endpoint URL appears in
# any frozen file. The endpoint is therefore configured here and verified
# against the live service during the adapter smoke test. Whether this
# warrants a dated documentation-correction entry in PROTOCOL.md section 11
# is Pengyin's call, flagged in STAGE1-NOTES.md.

timeout_s: 300
max_retries: 2

providers:
  anthropic_api:
    base_url: "https://api.anthropic.com"
    api_key_env: "ANTHROPIC_API_KEY"
  openai_api:
    base_url: "https://api.openai.com"
    api_key_env: "OPENAI_API_KEY"
  google_api:
    base_url: "https://generativelanguage.googleapis.com"
    api_key_env: "GEMINI_API_KEY"
  openai_compatible:
    base_url: "https://api.deepinfra.com/v1/openai"
    api_key_env: "DEEPINFRA_API_KEY"
  ollama:
    base_url: "http://localhost:11434"
    extra:
      keep_alive: "60m"   # model stays loaded across a batch (work-order item 4)

ledger:
  path: "out/cost_ledger.csv"
