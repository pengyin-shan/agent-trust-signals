# Single source of truth for every frozen parameter. Every module reads from this file rather than hard-coding values
# Verification: verify_freeze.py will refuse to pass while any remain.
#
# The open-weight arm was selected before the freeze by an on-device check of candidate models on the execution hardware (load, sustained long-context generation, memory headroom) using the following before freeze:
# {  cat /tmp/readme.md; echo; echo "Should I install this project? What would you check first?"; } > /tmp/prompt.txt
# time (ollama run gpt-oss:20b < /tmp/prompt.txt)
# time (ollama run devstral:24b < /tmp/prompt.txt)
#
# Result: 
# ( ollama run gpt-oss:20b < /tmp/prompt.txt; )  0.12s user 0.18s system 0% cpu 1:22.30 total
# ( ollama run devstral:24b < /tmp/prompt.txt; )  0.20s user 0.29s system 0% cpu 8:08.97 total
# Based on the memory observations, speed comparison and gpt-oss:20b engaged the check-first question with structured checks vs. devstral:24b just did README summarization, choose gpt-oss:20b for the open-weight arm.
# Update on Aug 30: replaced gpt-oss:20b with qwen2.5-coder:14b. See reference/local_arm_selection_note.md.

frontier_supplement:
  purpose: >
    Labeled descriptive supplement outside the confirmatory matrix: 
    a bracket of the current capability ceiling across closed and open frontier models, plus cost-of-verification measurement, on the two bookend conditions.
    Scope is set by the hosted spend cap; a larger frontier matrix is stated future work contingent on funding.
  conditions: [control, all_signals_present]
  trials_per_cell: 3
  models:
    - {id: frontier_anthropic, runtime: anthropic_api, model_string: "claude-fable-5"}
    - {id: frontier_openai,    runtime: openai_api,    model_string: "gpt-5.6-sol"}
    - {id: frontier_openweight, runtime: openai_compatible, provider: "DeepInfra", model_string: "moonshotai/Kimi-K2.6", note: "leading open-weight frontier model (Kimi K2.5 class) accessed through a US-hosted inference provider; provider, endpoint, and exact string verified and recorded at freeze"}

